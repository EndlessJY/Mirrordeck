name: 构建

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pick:
    name: 选择构建机
    runs-on: [self-hosted, mac-local]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: 选择运行环境
        id: pick
        run: |
          runner="$("$HOME/actions-runners/bin/pick-runner.sh" macos-15)"
          echo "选用 runner：$runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  build:
    name: macOS (Apple 芯片)
    needs: pick
    # 有免费额度时使用 GitHub 托管的 macos-15，额度不足时切换到本机 mac-local runner。
    # Homebrew's libraries here are built for the host macOS, which sets the
    # app's minimum system (see build_app.sh).
    runs-on: ${{ fromJSON(needs.pick.outputs.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备环境与清理残留产物
        run: |
          for dir in /opt/homebrew/bin /opt/homebrew/sbin; do
            if [[ -d "$dir" ]]; then
              echo "$dir" >> "$GITHUB_PATH"
            fi
          done
          if [[ -z "${ANDROID_HOME:-}" && -z "${ANDROID_SDK_ROOT:-}" && -d "$HOME/Library/Android/sdk" ]]; then
            echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
          fi
          if [[ -z "${JAVA_HOME:-}" && -d "/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home" ]]; then
            echo "JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home" >> "$GITHUB_ENV"
          fi
          rm -rf build release-notes.md

      # Controls only get the current system look (Liquid Glass) when the app
      # is built with the macOS 26 SDK; GitHub's default Xcode on macos-15 is older.
      - name: 选用 Xcode 26 / 检查 SDK
        run: |
          sdk_ver=$(xcrun --show-sdk-version 2>/dev/null || true)
          sdk_major="${sdk_ver%%.*}"
          if [[ "$sdk_major" =~ ^[0-9]+$ && "$sdk_major" -ge 26 ]]; then
            echo "当前构建环境已提供 macOS SDK ${sdk_ver} ($(xcode-select -p))，无需切换 Xcode"
            exit 0
          fi
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [[ -n "$xcode" ]] || { echo "构建机上没有 Xcode 26" >&2; ls -d /Applications/Xcode*.app 2>/dev/null || true; exit 1; }
          sudo xcode-select -s "$xcode"
          xcrun --show-sdk-version

      - name: 安装或校验构建依赖
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          if [[ "$RUNNER_ENV" == "self-hosted" ]]; then
            missing=()
            for pkg in meson ninja pkgconf dylibbundler sdl3 ffmpeg libusb webp; do
              if ! brew list --versions "$pkg" >/dev/null 2>&1; then
                missing+=("$pkg")
              fi
            done
            if (( ${#missing[@]} > 0 )); then
              echo "本机缺少构建依赖：${missing[*]}，按需安装..."
              brew install "${missing[@]}"
            else
              echo "本机 self-hosted runner 构建依赖已就绪，跳过全局 brew install"
            fi
          else
            brew install python@3.13 meson ninja pkgconf dylibbundler sdl3 ffmpeg libusb webp
          fi

          python_bin=""
          for candidate in /opt/homebrew/opt/python@3.13/bin/python3.13 /opt/homebrew/bin/python3; do
            if [[ -x "$candidate" ]] && "$candidate" -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then
              python_bin="$candidate"
              break
            fi
          done
          [[ -n "$python_bin" ]] || { echo "缺少 Python 3.11+ 环境" >&2; exit 1; }
          echo "选用 Python：$("$python_bin" --version) ($python_bin)"
          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"

      - name: 单元测试
        run: "$PYTHON_BIN" -m unittest discover -s tests -v

      - name: 构建应用
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build_app.sh

      - name: 打包
        run: |
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "幕台.app" Mirrordeck-macOS-arm64.zip
          /usr/bin/shasum -a 256 Mirrordeck-macOS-arm64.zip | tee Mirrordeck-macOS-arm64.zip.sha256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Mirrordeck-macOS-arm64-${{ github.run_number }}
          path: |
            build/Mirrordeck-macOS-arm64.zip
            build/Mirrordeck-macOS-arm64.zip.sha256
          if-no-files-found: error

      - name: 发布新版本
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plist="build/幕台.app/Contents/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          minimum=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$plist")
          # Each push to main is a new version; earlier versions stay listed.
          # The old single "最新构建" release is no longer used.
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          notes=""
          if [[ -n "$prev_tag" ]]; then
            # Every line of each commit message is one item (a title, then
            # one change per line), and a title joining several with "；"
            # is split too.
            notes=$(git log --no-merges --format='%B' "${prev_tag}..HEAD" \
              | grep -iv '^co-authored-by:' | perl -CSD -Mutf8 -pe 's/；/\n/g; s/^[-*•] *//; s/^ +//' \
              | grep -v '^$' | sed 's/^/- /' || true)
          fi
          if [[ -z "$notes" ]]; then
            notes=$(git log -1 --format=%B "$GITHUB_SHA" | grep -iv '^co-authored-by:' || true)
          fi
          {
            echo "## 本次更新"
            echo
            echo "$notes"
            echo
            echo "适用于 Apple 芯片 Mac，需要 macOS ${minimum} 或更新版本。应用未经 Apple 公证，首次打开请在“系统设置 › 隐私与安全性”中选择“仍要打开”。"
          } > release-notes.md
          gh release create "v$version" \
            build/Mirrordeck-macOS-arm64.zip build/Mirrordeck-macOS-arm64.zip.sha256 \
            --target "$GITHUB_SHA" --latest \
            --title "幕台 $version" \
            --notes-file release-notes.md
