name: 构建

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS (Apple 芯片)
    # GitHub no longer offers macOS 14 runners. Homebrew's libraries here are
    # built for macOS 15, which sets the app's minimum system (see build_app.sh).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装构建依赖
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install python@3.13 meson ninja pkgconf dylibbundler sdl3 ffmpeg libusb webp

      - name: 单元测试
        run: /opt/homebrew/opt/python@3.13/bin/python3.13 -m unittest discover -s tests -v

      - name: 构建应用
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build_app.sh

      - name: 打包
        run: |
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "幕台.app" Mirrordeck-macOS-arm64.zip
          /usr/bin/shasum -a 256 Mirrordeck-macOS-arm64.zip | tee Mirrordeck-macOS-arm64.zip.sha256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Mirrordeck-macOS-arm64-${{ github.run_number }}
          path: |
            build/Mirrordeck-macOS-arm64.zip
            build/Mirrordeck-macOS-arm64.zip.sha256
          if-no-files-found: error

      - name: 发布新版本
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plist="build/幕台.app/Contents/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          minimum=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$plist")
          # Each push to main is a new version; earlier versions stay listed.
          # The old single "最新构建" release is no longer used.
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          notes=""
          if [[ -n "$prev_tag" ]]; then
            notes=$(git log --no-merges --format='- %s' "${prev_tag}..HEAD" | grep -iv '^co-authored-by:' || true)
          fi
          if [[ -z "$notes" ]]; then
            notes=$(git log -1 --format=%B "$GITHUB_SHA" | grep -iv '^co-authored-by:' || true)
          fi
          {
            echo "## 本次更新"
            echo
            echo "$notes"
            echo
            echo "适用于 Apple 芯片 Mac，需要 macOS ${minimum} 或更新版本。应用未经 Apple 公证，首次打开请在“系统设置 › 隐私与安全性”中选择“仍要打开”。"
          } > release-notes.md
          gh release create "v$version" \
            build/Mirrordeck-macOS-arm64.zip build/Mirrordeck-macOS-arm64.zip.sha256 \
            --target "$GITHUB_SHA" --latest \
            --title "幕台 $version" \
            --notes-file release-notes.md
